
<div class="container">

  <h2 class="title">👨‍🌾 Lista de Trabajadores del Campo</h2>

  <table class="table">

    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>DNI</th>
        <th>Cargo</th>
        <th>Acción</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let t of trabajadores">
        <td>{{ t.id }}</td>
        <td>{{ t.nombre }}</td>
        <td>{{ t.apellido }}</td>
        <td>{{ t.dni }}</td>
        <td>{{ t.cargo }}</td>
        <td>
          <button class="btn-delete" (click)="eliminar(t.id!)">
            🗑 Eliminar
          </button>
        </td>
      </tr>
    </tbody>

  </table>

</div>

<style>
.container {
  background: linear-gradient(to bottom, #e8f5e9, #f1f8e9);
  padding: 20px;
  border-radius: 10px;
  font-family: Arial;
}

.title {
  color: #1b5e20;
  text-align: center;
}

.table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

.table th {
  background: #388e3c;
  color: white;
  padding: 10px;
}

.table td {
  border: 1px solid #c8e6c9;
  padding: 8px;
  text-align: center;
}

.btn-delete {
  background: #d32f2f;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 5px;
}

.btn-delete:hover {
  background: #b71c1c;
}
</style>
