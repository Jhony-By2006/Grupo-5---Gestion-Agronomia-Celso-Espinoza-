<h2>Crear Trabajador</h2>

<form (ngSubmit)="guardar()">

  <label>Nombre:</label><br>
  <input type="text" [(ngModel)]="trabajador.nombre" name="nombre" required><br><br>

  <label>Apellido:</label><br>
  <input type="text" [(ngModel)]="trabajador.apellido" name="apellido" required><br><br>

  <label>DNI:</label><br>
  <input type="text" [(ngModel)]="trabajador.dni" name="dni" required><br><br>

  <label>Cargo:</label><br>
  <input type="text" [(ngModel)]="trabajador.cargo" name="cargo" required><br><br>

  <button type="submit">Guardar</button>

</form>
