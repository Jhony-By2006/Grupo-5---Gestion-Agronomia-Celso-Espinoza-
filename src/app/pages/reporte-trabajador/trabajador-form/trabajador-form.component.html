<div class="container">

  <h2 class="title">👨‍🌾 Registrar Trabajador del Campo</h2>

  <form (ngSubmit)="guardar()" class="form">

    <label>Nombre</label>
    <input type="text" [(ngModel)]="trabajador.nombre" name="nombre" required>

    <label>Apellido</label>
    <input type="text" [(ngModel)]="trabajador.apellido" name="apellido" required>

    <label>DNI</label>
    <input type="text" [(ngModel)]="trabajador.dni" name="dni" required>

    <label>Cargo</label>
    <input type="text" [(ngModel)]="trabajador.cargo" name="cargo" required>

    <button type="submit">🌿 Guardar Trabajador</button>

  </form>

</div>

<style>
.container {
  background: linear-gradient(to bottom, #e8f5e9, #f1f8e9);
  padding: 25px;
  border-radius: 12px;
  font-family: Arial;
  width: 50%;
  margin: auto;
}

.title {
  text-align: center;
  color: #1b5e20;
}

.form {
  display: flex;
  flex-direction: column;
}

label {
  margin-top: 10px;
  font-weight: bold;
  color: #2e7d32;
}

input {
  padding: 8px;
  border: 1px solid #a5d6a7;
  border-radius: 6px;
}

button {
  margin-top: 15px;
  padding: 10px;
  background: #388e3c;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #1b5e20;
}
</style>
