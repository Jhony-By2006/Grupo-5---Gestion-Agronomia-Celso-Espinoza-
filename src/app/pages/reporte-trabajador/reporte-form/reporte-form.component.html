<div class="container">

  <h2 class="title">🌱 Crear Reporte Agrícola</h2>

  <form (ngSubmit)="guardar()" class="form">

    <label>Título</label>
    <input type="text" [(ngModel)]="reporte.titulo" name="titulo" required>

    <label>Descripción</label>
    <textarea [(ngModel)]="reporte.descripcion" name="descripcion" required></textarea>

    <label>Fecha</label>
    <input type="date" [(ngModel)]="reporte.fecha" name="fecha" required>

    <button type="submit">🌿 Guardar Reporte</button>

  </form>

</div>

<style>
.container {
  background: #e8f5e9;
  padding: 25px;
  border-radius: 12px;
  font-family: Arial;
  width: 50%;
  margin: auto;
}

.title {
  text-align: center;
  color: #2e7d32;
}

.form {
  display: flex;
  flex-direction: column;
}

label {
  margin-top: 10px;
  font-weight: bold;
  color: #1b5e20;
}

input, textarea {
  padding: 8px;
  border: 1px solid #a5d6a7;
  border-radius: 6px;
}

button {
  margin-top: 15px;
  padding: 10px;
  background: #2e7d32;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #1b5e20;
}
</style>
