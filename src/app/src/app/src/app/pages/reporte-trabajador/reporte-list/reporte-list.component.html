<h2>Lista de Reportes</h2>

<table border="1" width="100%" cellpadding="8">
  <thead>
    <tr>
      <th>ID</th>
      <th>Título</th>
      <th>Descripción</th>
      <th>Fecha</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let r of reportes">
      <td>{{ r.id }}</td>
      <td>{{ r.titulo }}</td>
      <td>{{ r.descripcion }}</td>
      <td>{{ r.fecha }}</td>
      <td>
        <button (click)="eliminar(r.id!)">
          Eliminar
        </button>
      </td>
    </tr>
  </tbody>
</table>
